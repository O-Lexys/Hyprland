[general]
mode = normal
framerate = 15
bars = 3

[input]
# 'pulse' працює і на чистому PulseAudio, і на PipeWire (через pipewire-pulse)
# якщо cava зібрана з підтримкою pipewire напряму — можна поставити method = pipewire
method = pulse
source = auto

[output]
method = raw
raw_target = /tmp/hypr-music-shader.fifo
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 40
